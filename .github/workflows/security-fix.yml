name: One-time dependency security fix

on:
  push:
    branches:
      - agent/full-code-fixes

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-code-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
      - name: Fix backend production dependencies
        working-directory: backend
        run: |
          npm ci
          npm audit fix
      - name: Fix frontend production dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit fix
      - name: Commit security updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were needed"
          else
            git commit -m "Update dependencies for security advisories"
            git push origin HEAD:agent/full-code-fixes
          fi
