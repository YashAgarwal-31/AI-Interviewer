name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - run: npm test
      - run: npm run check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run build

  candidate-security-migration:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/full-code-fixes
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - name: Migrate candidate credential handling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          home_path = Path('frontend/src/pages/HomePage.jsx')
          text = home_path.read_text()

          text = text.replace("import { useNavigate } from 'react-router-dom'\n", '')
          text = text.replace('    const navigate = useNavigate()\n', '')
          text = text.replace("    const [candidateIdInput, setCandidateIdInput] = useState('')\n", '')
          text = text.replace("    const [isLoadingSession, setIsLoadingSession] = useState(false)\n", '')

          start_marker = '    // Generate session URL for sharing\n'
          end_marker = '    // Text-to-Speech function\n'
          if start_marker not in text or end_marker not in text:
              raise SystemExit('Legacy candidate-ID access block markers were not found')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end:]

          text = text.replace('localStorage', 'sessionStorage')

          old_parse = """        const candidateId = urlParams.get('candidateId')
        const sessionId = urlParams.get('sessionId')
        const accessToken = urlParams.get('accessToken')

        // Auto-load session if URL contains session parameters
        if (candidateId) {
"""
          new_parse = """        const candidateId = urlParams.get('candidateId')
        const sessionId = urlParams.get('sessionId')
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''))
        const accessToken = hashParams.get('accessToken') || urlParams.get('accessToken')

        if (candidateId || sessionId || accessToken) {
            window.history.replaceState({}, document.title, window.location.pathname)
        }

        if (candidateId && !accessToken) {
            setSessionError('This interview link is incomplete. Please open the full secure link sent by your recruiter.')
            return
        }

        // Auto-load only a signed invite; candidate IDs are identifiers, not credentials.
        if (candidateId && accessToken) {
"""
          if old_parse not in text:
              raise SystemExit('Direct invite parsing block was not found')
          text = text.replace(old_parse, new_parse, 1)

          text = text.replace('• ID provided by recruiter', '• Use only the secure link provided by your recruiter')
          text = text.replace('Enter your candidate ID to access your interview session.', 'Open the secure interview link sent by your recruiter. Candidate ID alone cannot unlock an interview.')

          ui_start = '                                {/* Candidate ID Input */}\n'
          ui_end = '                                {/* Error Message */}\n'
          if ui_start not in text or ui_end not in text:
              raise SystemExit('Candidate ID form markers were not found')
          ui_start_index = text.index(ui_start)
          ui_end_index = text.index(ui_end, ui_start_index)
          secure_notice = """                                <div className=\"rounded-xl border border-blue-200 bg-blue-50 p-5 text-center\">
                                    <div className=\"mx-auto mb-3 flex h-11 w-11 items-center justify-center rounded-full bg-blue-100 text-blue-700\">
                                        <svg className=\"h-5 w-5\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">
                                            <path strokeLinecap=\"round\" strokeLinejoin=\"round\" strokeWidth={2} d=\"M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2h-1V7a5 5 0 00-10 0v4H6a2 2 0 00-2 2v6a2 2 0 002 2zm3-10V7a3 3 0 016 0v4H9z\" />
                                        </svg>
                                    </div>
                                    <p className=\"font-semibold text-blue-950\">Secure invite required</p>
                                    <p className=\"mt-2 text-sm leading-6 text-blue-800\">Open the complete interview link from your recruiter or invitation email. For your security, a candidate ID by itself is never accepted.</p>
                                </div>

"""
          text = text[:ui_start_index] + secure_notice + text[ui_end_index:]
          home_path.write_text(text)

          for file_name in [
              'backend/routes/sessions.js',
              'backend/routes/scheduledSessions.js',
              'backend/routes/email.js',
          ]:
              path = Path(file_name)
              source = path.read_text()
              source, count = re.subn(
                  r'(sessionId:\s*String\([^\n]+\)),\n\s*accessToken:\s*String\(accessToken\)',
                  r'\1',
                  source,
              )
              if count < 1:
                  raise SystemExit(f'Access-token query parameter pattern not found in {file_name}')
              old_return = 'return `${frontendBaseUrl()}/?${params.toString()}`;'
              new_return = 'return `${frontendBaseUrl()}/?${params.toString()}#accessToken=${encodeURIComponent(String(accessToken))}`;'
              if old_return not in source:
                  raise SystemExit(f'Invite URL return pattern not found in {file_name}')
              source = source.replace(old_return, new_return, 1)
              path.write_text(source)
          PY
      - name: Verify migrated application
        run: |
          cd backend
          npm ci
          npm test
          npm run check
          cd ../frontend
          npm ci
          npm run lint
          npm run build
      - name: Commit migrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/HomePage.jsx backend/routes/sessions.js backend/routes/scheduledSessions.js backend/routes/email.js
          if git diff --cached --quiet; then
            echo "Candidate credential migration already applied"
          else
            git commit -m "Harden candidate invite credential handling"
            git push origin HEAD:agent/full-code-fixes
          fi
