name: CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGO_INTEGRATION_URI: mongodb://127.0.0.1:27017
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - run: npm test
      - run: npm run check
      - name: Live Gemini API smoke
        if: ${{ github.event_name == 'workflow_dispatch' && env.GEMINI_API_KEY != '' }}
        env:
          GEMINI_INTERVIEW_MODEL: gemini-3.8-flash
        run: npm run smoke:gemini
      - name: Report missing Gemini smoke credential
        if: ${{ github.event_name == 'workflow_dispatch' && env.GEMINI_API_KEY == '' }}
        run: echo "::warning::GEMINI_API_KEY secret is not configured; live Gemini smoke was skipped."

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - run: npm run lint
      - run: npm test
      - run: npm run build
